<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ToDo List</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    #loginForm, #todoApp {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    input[type="text"], input[type="password"] {
      width: calc(100% - 22px);
      padding: 10px;
      margin: 5px 0 10px;
    }
    button {
      padding: 8px 15px;
      margin-right: 5px;
    }
    ul {
      padding: 0;
      list-style: none;
    }
    li {
      background: #fafafa;
      margin-bottom: 5px;
      padding: 8px;
      border: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <h1>ToDo List</h1>

  <div id="loginForm">
    <h2>Вход</h2>
    <input type="text" id="username" placeholder="Логин" /><br />
    <input type="password" id="password" placeholder="Пароль" /><br />
    <button onclick="login()">Войти</button>
    <p id="loginError" style="color: red;"></p>
  </div>

  <div id="todoApp" style="display: none;">
    <button onclick="logout()" style="float: right;">Выход</button>
    <h2>Задачи</h2>
    <input type="text" id="newTodo" placeholder="Новая задача" />
    <button onclick="addTodo()">Добавить</button>
    <ul id="todoList"></ul>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('todoApp').style.display = 'block';
        loadTodos();
      } else {
        document.getElementById('loginError').textContent = 'Неверный логин или пароль.';
      }
    }

    async function logout() {
      await fetch('/logout', { method: 'POST' });
      location.reload();
    }

    async function loadTodos() {
      const res = await fetch('/todos');
      const todos = await res.json();
      const list = document.getElementById('todoList');
      list.innerHTML = '';
      todos.forEach(todo => {
        const li = document.createElement('li');
        const input = document.createElement('input');
        input.value = todo.text;
        input.style.flex = '1';
        input.addEventListener('change', () => updateTodo(todo.id, input.value));

        const delBtn = document.createElement('button');
        delBtn.textContent = 'Удалить';
        delBtn.onclick = () => deleteTodo(todo.id);

        li.appendChild(input);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    async function addTodo() {
      const text = document.getElementById('newTodo').value.trim();
      if (!text) return;
      await fetch('/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      document.getElementById('newTodo').value = '';
      loadTodos();
    }

    async function updateTodo(id, text) {
      await fetch(`/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
    }

    async function deleteTodo(id) {
      await fetch(`/todos/${id}`, { method: 'DELETE' });
      loadTodos();
    }
  </script>
</body>
</html>
