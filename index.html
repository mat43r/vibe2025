<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 80%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        .edit-input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>ID</th>
            <th>Text</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>

<script>
    async function refreshList() {
        const response = await fetch('/items');
        const items = await response.json();
        renderList(items);
    }

    function renderList(items) {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';

        items.forEach((item) => {
            const row = document.createElement('tr');
            row.dataset.id = item.id;
            row.innerHTML = `
                <td>${item.id}</td>
                <td class="item-text">${item.text}</td>
                <td>
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </td>
            `;
            listBody.appendChild(row);
        });

        // Add event listeners for edit and delete buttons
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', startEditing);
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', deleteItem);
        });
    }

    function startEditing(e) {
        const row = e.target.closest('tr');
        const id = row.dataset.id;
        const textCell = row.querySelector('.item-text');
        const currentText = textCell.textContent;
        
        textCell.innerHTML = `
            <input type="text" class="edit-input" value="${currentText}">
            <button onclick="saveEdit(${id})">Save</button>
            <button onclick="cancelEdit(${id}, '${currentText}')">Cancel</button>
        `;
    }

    async function saveEdit(id) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        const newText = row.querySelector('.edit-input').value;
        
        try {
            const response = await fetch(`/items/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: newText })
            });
            
            if (response.ok) {
                refreshList();
            }
        } catch (error) {
            console.error('Error updating item:', error);
        }
    }

    function cancelEdit(id, originalText) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        const textCell = row.querySelector('.item-text');
        textCell.textContent = originalText;
    }

    async function addItem() {
        const newItemText = document.getElementById('newItem').value.trim();
        
        if (newItemText) {
            try {
                const response = await fetch('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: newItemText })
                });
                
                if (response.ok) {
                    document.getElementById('newItem').value = '';
                    refreshList();
                }
            } catch (error) {
                console.error('Error adding item:', error);
            }
        }
    }

    async function deleteItem(e) {
        const id = e.target.closest('tr').dataset.id;
        
        try {
            const response = await fetch(`/items/${id}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                refreshList();
            }
        } catch (error) {
            console.error('Error deleting item:', error);
        }
    }

    // Initial load
    refreshList();
</script>

</body>
</html>
