<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do List</title>
<style>
body {
  font-family: Arial, sans-serif;
}
#todoList {
  border-collapse: collapse;
  width: 70%;
  margin: 0 auto;
}
#todoList th,
#todoList td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: left;
}
#todoList th {
  background-color: #f0f0f0;
}
#todoList th:first-child,
#todoList th:last-child {
  width: 5%;
}
#todoList th:nth-child(2) {
  width: 90%;
}
.add-form {
  margin-top: 20px;
  width: 70%;
  margin: 20px auto;
}
.add-form input[type="text"] {
  padding: 8px;
  width: 70%;
}
.add-form button {
  padding: 8px;
  width: 20%;
}
button.delete-btn {
  background-color: #ff4d4d;
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 3px;
}
button.delete-btn:hover {
  background-color: #cc0000;
}
</style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
   <thead>
<tr>
<th>Number</th>
<th>Text</th>
<th>Action</th>
</tr>
</thead>
<tbody id="listBody">
{{rows}}
</tbody>
</table>

<div class="add-form">
   <input type="text" id="newItem" placeholder="Enter new item" />
   <button onclick="addItem()">Add</button>
</div>

<script>
    async function deleteItem(id) {
  if (!confirm('Are you sure you want to delete this item?')) return;

    try {
    const response = await fetch(`/delete?id=${id}`, { method: 'DELETE' });
    if (response.ok) {
      // Reload the page to update the list
      window.location.reload();
    } else {
      alert('Failed to delete item');
    }
    } catch (err) {
    alert('Error deleting item');
    console.error(err);
  }
}

   function addItem() {
  const newItemInput = document.getElementById('newItem');
  const newItemText = newItemInput.value.trim();
  if (!newItemText) return;
         // Send POST request to add item (optional feature, not implemented here)
  alert('Adding new items to DB is not implemented yet.');
  newItemInput.value = '';
}
    function removeItem(index) {
        items.splice(index, 1);
        renderList();
    }
</script>

</body>
</html>
