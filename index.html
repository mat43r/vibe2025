<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    :root {
      --primary: #4a6fa5;
      --danger: #e74c3c;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: var(--primary);
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    #newItem {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add {
      background: var(--primary);
      color: white;
    }
    .btn-delete {
      background: var(--danger);
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
    }
    tr:hover {
      background-color: #f5f5f5;
    }
    .no-tasks {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Мой To-Do List</h1>
  
  <div class="input-group">
    <input type="text" id="newItem" placeholder="Введите новую задачу...">
    <button onclick="addItem()" class="btn-add">Добавить</button>
  </div>
  
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Задача</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="tasksList">
      {{rows}}
    </tbody>
  </table>

  <script>
    // Добавление задачи
    async function addItem() {
      const input = document.getElementById('newItem');
      const text = input.value.trim();
      
      if (!text) {
        alert('Введите текст задачи');
        return;
      }

      try {
        const response = await fetch('/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ text })
        });

        if (response.ok) {
          window.location.reload();
        } else {
          alert('Ошибка при добавлении');
        }
      } catch (error) {
        alert('Ошибка соединения');
      }
    }

    // Удаление задачи
    async function deleteItem(id) {
      if (!confirm('Вы уверены, что хотите удалить эту задачу?')) {
        return;
      }

      try {
        const response = await fetch(`/delete/${id}`, {
          method: 'POST'
        });

        if (response.ok) {
          window.location.reload();
        } else {
          alert('Ошибка при удалении');
        }
      } catch (error) {
        alert('Ошибка соединения');
      }
    }

    // Фокус на поле ввода при загрузке
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('newItem').focus();
    });
  </script>
</body>
</html>
